---
name: "Publish plugin to grc.store"

# Manual-only on purpose. The first successful publish TOFU-pins the signer
# identity of this plugin's coordinate to THIS workflow file's path, so it has
# to be a deliberate act and every later publish must come from this same file. Add a
# `release: {types: [published]}` trigger once the manual run is proven.
on:
  workflow_dispatch:
    inputs:
      tag:
        # goreleaser (without --snapshot) refuses anything but an exact tag,
        # so promise only what a dispatch can deliver.
        description: "Tag to build and publish (e.g. v0.28.0)"
        required: true
      hub-url:
        description: "grc.store hub to publish to"
        required: true
        type: choice
        default: "https://hub.preview.grc.store"
        options:
          - "https://hub.preview.grc.store"
          - "https://hub.grc.store"

permissions: {}

# The first successful publish TOFU-pins the signer, so never let two publishes
# race; queue them instead.
concurrency:
  group: publish-plugin
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    # Copied verbatim into generated plugins; there is nothing to publish here.
    if: ${{ !endsWith(github.repository, '/plugin-generator-templates') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mints two distinct OIDC tokens: the hub push token (audience =
      # ci_audience) and the Sigstore signing identity (audience = sigstore,
      # requested by pvtr itself). The hub must list this repo as a
      # ci_publishers trusted publisher for the plugin's namespace (Publisher in
      # main.go).
      id-token: write
    env:
      PVTR_VERSION: v0.24.1
      PVTR_HUB_URL: ${{ inputs.hub-url }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: install pvtr
        # pvtr can require a newer Go than this repo's go.mod (setup-go pins
        # GOTOOLCHAIN=local to the go.mod version); auto lets go fetch the
        # toolchain pvtr needs for this step only.
        env:
          GOTOOLCHAIN: auto
        run: go install "github.com/privateerproj/pvtr@${PVTR_VERSION}"
      # The build is reproducible (-trimpath, BuiltAt = commit date in
      # .goreleaser.yaml), so with the same Go from go.mod this rebuild is
      # byte-identical to the binaries the GitHub release attested.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: build --clean
      - name: publish
        # pvtr reads the plugin's coordinate, license and catalog linkage from
        # the built binary itself.
        run: |
          set -euo pipefail
          # jq -e fails the step on a missing/null field; pipefail covers the curls.
          audience=$(curl -fsSL "${PVTR_HUB_URL}/.well-known/grc-store-configuration" | jq -er '.ci_audience // empty')
          audience_uri=$(jq -rn --arg a "$audience" '$a|@uri')
          PVTR_TOKEN=$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${audience_uri}" | jq -er '.value // empty')
          echo "::add-mask::${PVTR_TOKEN}"
          export PVTR_TOKEN
          pvtr publish
